name: Tests
on:
  push:
    branches: [public-release, dev, "ci-trial/**"]
  pull_request:
    branches: [public-release, dev]

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 has no build for Ubuntu 26.04 (ubuntu-latest) and numba has
        # no Intel-macOS wheels for Python 3.12, so the pairs are listed explicitly.
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-15-intel
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Regression tests load historical revisions via git show.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jax jaxlib -r examples/plasma-turbulence/requirements.txt
      - name: Install aweSOM
        # production_pool provenance requires the imported package inside the git checkout.
        run: pip install -e .
      - name: Run tests
        # The tests read examples/iris/... by relative path, so run them from the checkout root.
        # macOS runners expose 3 vCPUs, while CPU reference fixtures exercise n_threads=4.
        env:
          NUMBA_NUM_THREADS: "4"
        run: python -m pytest -q tests
